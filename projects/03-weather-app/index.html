<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyPulse Weather | Dynamic Meteorological Studio</title>
    <meta
      name="description"
      content="Live weather forecast dashboard with dual API & smart fallback engine, 5-day forecast, unit converter, geolocation, and atmospheric metrics."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Top Navigation Dock -->
    <header class="weather-header">
      <div class="header-left">
        <a href="../../index.html" class="nav-hub-btn" title="Return to Projects Hub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Hub</span>
        </a>
        <div class="brand">
          <span class="brand-badge">#03</span>
          <span class="brand-title">SkyPulse Weather</span>
        </div>
      </div>

      <div class="header-right">
        <!-- Unit Switcher -->
        <div class="unit-toggle" id="unitToggle" role="group" aria-label="Temperature Units">
          <button class="unit-btn active" data-unit="metric">°C</button>
          <button class="unit-btn" data-unit="imperial">°F</button>
        </div>
      </div>
    </header>

    <!-- Main Stage -->
    <main class="weather-stage">
      <div class="weather-container">
        <!-- Search & Location Bar -->
        <div class="search-section">
          <form class="search-form" id="searchForm">
            <div class="search-input-wrapper">
              <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input
                type="text"
                id="cityInput"
                class="city-input"
                placeholder="Search city (e.g. Tehran, London, Tokyo)..."
                autocomplete="off"
                required
              />
              <button type="button" class="btn-geo" id="geoBtn" title="Use Current Location">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
                </svg>
              </button>
            </div>
            <button type="submit" class="btn-search-submit">Search</button>
          </form>

          <!-- Popular Quick Cities -->
          <div class="quick-cities" id="quickCities">
            <button class="city-chip" data-city="Tehran">Tehran</button>
            <button class="city-chip" data-city="London">London</button>
            <button class="city-chip" data-city="New York">New York</button>
            <button class="city-chip" data-city="Tokyo">Tokyo</button>
            <button class="city-chip" data-city="Paris">Paris</button>
          </div>
        </div>

        <!-- Main Weather Dashboard Card -->
        <section class="weather-card glass-card" id="weatherCard">
          <!-- Card Header / Location -->
          <div class="card-head">
            <div class="location-box">
              <h2 class="city-name" id="cityName">Tehran</h2>
              <span class="country-tag" id="countryCode">IR</span>
            </div>
            <div class="date-box" id="currentDate">Saturday, Sep 6</div>
          </div>

          <!-- Hero Temperature Row -->
          <div class="hero-temp-row">
            <div class="weather-icon-wrapper">
              <img src="assets/svg/bx-sun.svg" alt="Weather condition" class="hero-icon" id="weatherIcon" />
            </div>
            <div class="temp-display">
              <div class="main-temperature" id="tempValue">24°</div>
              <div class="weather-condition" id="weatherDesc">Clear Sky</div>
            </div>
          </div>

          <!-- Secondary Atmospheric Metrics -->
          <div class="metrics-grid">
            <div class="metric-box">
              <img src="assets/svg/bx-water.svg" alt="Humidity" class="metric-icon" />
              <div class="metric-data">
                <span class="metric-value" id="humidityVal">32%</span>
                <span class="metric-label">Humidity</span>
              </div>
            </div>

            <div class="metric-box">
              <img src="assets/svg/bx-wind.svg" alt="Wind" class="metric-icon" />
              <div class="metric-data">
                <span class="metric-value" id="windVal">14 km/h</span>
                <span class="metric-label">Wind Speed</span>
              </div>
            </div>

            <div class="metric-box">
              <svg class="metric-icon-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"></path>
              </svg>
              <div class="metric-data">
                <span class="metric-value" id="feelsLikeVal">25°</span>
                <span class="metric-label">Feels Like</span>
              </div>
            </div>

            <div class="metric-box">
              <svg class="metric-icon-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
              </svg>
              <div class="metric-data">
                <span class="metric-value" id="pressureVal">1016 hPa</span>
                <span class="metric-label">Pressure</span>
              </div>
            </div>
          </div>

          <!-- 5-Day Forecast Strip -->
          <div class="forecast-section">
            <h3 class="forecast-title">5-Day Forecast</h3>
            <div class="forecast-strip" id="forecastStrip">
              <!-- Dynamically populated 5 days -->
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- Toast Notification Banner -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="app.js"></script>
  </body>
</html>
