<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow Studio | Persistent CRUD Organizer</title>
    <meta
      name="description"
      content="A full-featured task & grocery organizer with CRUD, priorities, categories, due dates, search, filters, batch actions and LocalStorage persistence."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="task-header">
      <div class="header-left">
        <a href="../../index.html" class="nav-hub-btn" title="Return to Projects Hub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Hub</span>
        </a>
        <div class="brand">
          <span class="brand-badge">#13</span>
          <span class="brand-title">TaskFlow Studio</span>
        </div>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="btnExport" title="Export tasks as JSON">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>
        <button class="icon-btn" id="btnImport" title="Import tasks from JSON">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
        </button>
        <button class="icon-btn" id="btnShortcuts" title="Keyboard shortcuts (?)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect>
            <path d="M6 8h.001M10 8h.001M14 8h.001M18 8h.001M8 12h.001M12 12h.001M16 12h.001M7 16h10"></path>
          </svg>
        </button>
        <input type="file" id="importFile" accept="application/json" class="hidden" />
      </div>
    </header>

    <main class="task-stage">
      <div class="task-shell">
        <!-- Stats ribbon -->
        <section class="glass-card stats-ribbon" aria-label="Task statistics">
          <div class="ring-wrap">
            <svg class="progress-ring" width="92" height="92" viewBox="0 0 92 92">
              <circle class="ring-track" cx="46" cy="46" r="38"></circle>
              <circle class="ring-fill" id="progressRing" cx="46" cy="46" r="38"></circle>
            </svg>
            <div class="ring-center">
              <span class="ring-pct" id="ringPct">0%</span>
              <span class="ring-sub">done</span>
            </div>
          </div>
          <div class="stats-grid">
            <div class="stat"><span class="stat-num" id="statTotal">0</span><span class="stat-label">Total</span></div>
            <div class="stat"><span class="stat-num accent-blue" id="statActive">0</span><span class="stat-label">Active</span></div>
            <div class="stat"><span class="stat-num accent-green" id="statDone">0</span><span class="stat-label">Completed</span></div>
            <div class="stat"><span class="stat-num accent-red" id="statOverdue">0</span><span class="stat-label">Overdue</span></div>
          </div>
        </section>

        <!-- Add task card -->
        <section class="glass-card add-card" aria-label="Add new task">
          <h2 class="card-title">＋ New Task</h2>
          <div class="add-grid">
            <input type="text" id="inputTitle" class="field field-title" placeholder="What needs to be done? (press Enter ↵)" maxlength="120" autocomplete="off" />
            <select id="inputCategory" class="field" title="Category">
              <option value="grocery">🛒 Grocery</option>
              <option value="personal">🙋 Personal</option>
              <option value="work">💼 Work</option>
              <option value="health">💪 Health</option>
              <option value="home">🏠 Home</option>
              <option value="other">📦 Other</option>
            </select>
            <select id="inputPriority" class="field" title="Priority">
              <option value="low">🟢 Low</option>
              <option value="medium" selected>🟡 Medium</option>
              <option value="high">🔴 High</option>
            </select>
            <input type="date" id="inputDue" class="field" title="Due date (optional)" />
            <button class="btn-primary" id="btnAdd">Add Task</button>
          </div>
        </section>

        <!-- Toolbar -->
        <section class="glass-card toolbar" aria-label="Search, filter and sort">
          <div class="search-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchInput" placeholder="Search tasks... ( / )" autocomplete="off" />
          </div>
          <div class="pills" id="statusPills" role="tablist">
            <button class="pill active" data-status="all">All</button>
            <button class="pill" data-status="active">Active</button>
            <button class="pill" data-status="completed">Completed</button>
          </div>
          <select id="filterCategory" class="field field-sm" title="Filter by category">
            <option value="all">All categories</option>
            <option value="grocery">🛒 Grocery</option>
            <option value="personal">🙋 Personal</option>
            <option value="work">💼 Work</option>
            <option value="health">💪 Health</option>
            <option value="home">🏠 Home</option>
            <option value="other">📦 Other</option>
          </select>
          <select id="sortSelect" class="field field-sm" title="Sort order">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="priority">Priority ↓</option>
            <option value="due">Due date ↑</option>
            <option value="alpha">A → Z</option>
          </select>
        </section>

        <!-- Task list -->
        <section aria-label="Task list">
          <ul class="task-list" id="taskList"></ul>
          <div class="empty-state glass-card hidden" id="emptyState">
            <span class="empty-icon">📝</span>
            <h3>No tasks found</h3>
            <p>Add your first task above, or adjust the search & filters.</p>
          </div>
        </section>

        <!-- Batch actions -->
        <section class="glass-card batch-bar" aria-label="Batch actions">
          <span class="batch-info" id="batchInfo">0 tasks</span>
          <div class="batch-btns">
            <button class="btn-ghost" id="btnCompleteAll">✓ Complete all</button>
            <button class="btn-ghost" id="btnClearDone">Clear completed</button>
            <button class="btn-ghost danger" id="btnClearAll">Delete all</button>
          </div>
        </section>
      </div>
    </main>

    <!-- Edit modal -->
    <div class="modal-overlay hidden" id="editModal">
      <div class="modal-window glass-card" role="dialog" aria-modal="true" aria-label="Edit task">
        <div class="modal-header">
          <h3>✏️ Edit Task</h3>
          <button class="btn-close" id="btnCloseEdit">✕</button>
        </div>
        <div class="modal-body">
          <label class="lbl">Title<input type="text" id="editTitle" class="field" maxlength="120" /></label>
          <div class="modal-row">
            <label class="lbl">Category
              <select id="editCategory" class="field">
                <option value="grocery">🛒 Grocery</option>
                <option value="personal">🙋 Personal</option>
                <option value="work">💼 Work</option>
                <option value="health">💪 Health</option>
                <option value="home">🏠 Home</option>
                <option value="other">📦 Other</option>
              </select>
            </label>
            <label class="lbl">Priority
              <select id="editPriority" class="field">
                <option value="low">🟢 Low</option>
                <option value="medium">🟡 Medium</option>
                <option value="high">🔴 High</option>
              </select>
            </label>
          </div>
          <div class="modal-row">
            <label class="lbl">Due date<input type="date" id="editDue" class="field" /></label>
            <label class="lbl lbl-check"><input type="checkbox" id="editDone" /> Mark as completed</label>
          </div>
          <label class="lbl">Notes<textarea id="editNotes" class="field" rows="3" maxlength="500" placeholder="Optional notes..."></textarea></label>
        </div>
        <div class="modal-footer">
          <button class="btn-ghost danger" id="btnDeleteTask">Delete</button>
          <div>
            <button class="btn-ghost" id="btnCancelEdit">Cancel</button>
            <button class="btn-primary" id="btnSaveEdit">Save changes</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Shortcuts modal -->
    <div class="modal-overlay hidden" id="shortcutsModal">
      <div class="modal-window glass-card small">
        <div class="modal-header">
          <h3>⌨️ Shortcuts</h3>
          <button class="btn-close" id="btnCloseShortcuts">✕</button>
        </div>
        <div class="modal-body">
          <ul class="shortcuts-list">
            <li><span>Add task</span><kbd>Enter</kbd></li>
            <li><span>Focus search</span><kbd>/</kbd></li>
            <li><span>Close dialog</span><kbd>Esc</kbd></li>
          </ul>
        </div>
      </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <script src="app.js"></script>
  </body>
</html>
