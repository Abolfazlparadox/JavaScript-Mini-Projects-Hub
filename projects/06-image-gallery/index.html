<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina Gallery Pro | Responsive Lightbox & Showcase</title>
    <meta
      name="description"
      content="A modern responsive image gallery with categorized filters, fullscreen lightbox modal, keyboard navigation, and thumbnail filmstrip."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Top Navigation Dock -->
    <header class="gallery-header">
      <div class="header-left">
        <a href="../../index.html" class="nav-hub-btn" title="Return to Projects Hub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Hub</span>
        </a>
        <div class="brand">
          <span class="brand-badge">#06</span>
          <span class="brand-title">Lumina Gallery Pro</span>
        </div>
      </div>

      <!-- Filter Tabs -->
      <nav class="filter-tabs" id="filterTabs">
        <button class="tab-btn active" data-filter="all">All Photos</button>
        <button class="tab-btn" data-filter="nature">Nature</button>
        <button class="tab-btn" data-filter="urban">Urban & Streets</button>
        <button class="tab-btn" data-filter="minimal">Minimalist</button>
      </nav>
    </header>

    <!-- Main Workspace Stage -->
    <main class="gallery-stage">
      <div class="gallery-container">
        <!-- Gallery Grid -->
        <div class="photos-grid" id="photosGrid">
          <!-- Dynamically populated photo cards -->
        </div>
      </div>
    </main>

    <!-- Fullscreen Lightbox Modal -->
    <div class="lightbox-overlay hidden" id="lightboxModal" role="dialog" aria-modal="true">
      <div class="lightbox-wrapper">
        <!-- Header Controls -->
        <div class="lightbox-header">
          <div class="lightbox-meta">
            <span class="lightbox-counter" id="lightboxCounter">1 of 6</span>
            <h3 class="lightbox-title" id="lightboxTitle">Photo Showcase</h3>
          </div>
          <div class="lightbox-actions">
            <button class="action-btn" id="btnDownload" title="Download Image">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
            </button>
            <button class="action-btn close-btn" id="btnCloseLightbox" title="Close (Esc)">✕</button>
          </div>
        </div>

        <!-- Stage Viewport -->
        <div class="lightbox-stage">
          <button class="nav-arrow prev-arrow" id="btnLightboxPrev" title="Previous (←)">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
          </button>

          <div class="lightbox-img-box">
            <img src="" alt="Active View" class="lightbox-img" id="lightboxActiveImg" />
          </div>

          <button class="nav-arrow next-arrow" id="btnLightboxNext" title="Next (→)">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </div>

        <!-- Filmstrip Strip -->
        <div class="lightbox-filmstrip" id="lightboxFilmstrip"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
