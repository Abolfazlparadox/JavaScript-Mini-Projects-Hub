<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PassForge Studio | Password Generator & Strength Lab</title>
    <meta name="description" content="Secure password, passphrase & PIN generator with entropy analysis, crack-time estimates and local history." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="pf-header">
      <div class="header-left">
        <a href="../../index.html" class="nav-hub-btn" title="Return to Projects Hub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          <span>Hub</span>
        </a>
        <div class="brand"><span class="brand-badge">#19</span><span class="brand-title">PassForge Studio</span></div>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="btnCopyTop" title="Copy password (C)">📋</button>
        <button class="icon-btn" id="btnRegenTop" title="Regenerate (G)">🎲</button>
      </div>
    </header>

    <main class="pf-stage">
      <div class="pf-shell">
        <!-- Output -->
        <section class="glass-card output-card" aria-label="Generated password">
          <div class="mode-tabs" id="modeTabs" role="tablist">
            <button class="mode-btn active" data-mode="password">🔑 Password</button>
            <button class="mode-btn" data-mode="passphrase">📖 Passphrase</button>
            <button class="mode-btn" data-mode="pin">🔢 PIN</button>
          </div>
          <div class="output-box" id="outputBox" title="Click to copy">
            <code id="outputText">—</code>
          </div>
          <div class="strength-row">
            <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
            <span class="strength-label" id="strengthLabel">—</span>
          </div>
          <div class="entropy-grid">
            <div class="e-cell"><span>Entropy</span><strong id="statEntropy">0 bits</strong></div>
            <div class="e-cell"><span>Charset</span><strong id="statCharset">0</strong></div>
            <div class="e-cell"><span>Crack time</span><strong id="statCrack">—</strong></div>
            <div class="e-cell"><span>Length</span><strong id="statLen">0</strong></div>
          </div>
          <div class="output-actions">
            <button class="btn-primary" id="btnGenerate">🎲 Generate <kbd>G</kbd></button>
            <button class="btn-ghost" id="btnCopy">📋 Copy <kbd>C</kbd></button>
          </div>
        </section>

        <!-- Options -->
        <section class="glass-card opts-card" aria-label="Generator options">
          <h2>⚙️ Options</h2>
          <div id="passwordOpts">
            <label class="slider-row">Length <strong id="lenVal">20</strong>
              <input type="range" id="lenSlider" min="4" max="64" value="20" />
            </label>
            <div class="check-grid">
              <label class="check"><input type="checkbox" id="optUpper" checked /> ABC <span>uppercase</span></label>
              <label class="check"><input type="checkbox" id="optLower" checked /> abc <span>lowercase</span></label>
              <label class="check"><input type="checkbox" id="optDigits" checked /> 123 <span>digits</span></label>
              <label class="check"><input type="checkbox" id="optSymbols" checked /> #$& <span>symbols</span></label>
              <label class="check"><input type="checkbox" id="optAmbiguous" checked /> ⊘ <span>exclude ambiguous <em>0O1lI|</em></span></label>
            </div>
          </div>
          <div id="passphraseOpts" class="hidden">
            <label class="slider-row">Words <strong id="wordsVal">5</strong>
              <input type="range" id="wordsSlider" min="3" max="10" value="5" />
            </label>
            <label class="slider-row">Separator
              <select id="sepSelect" class="field">
                <option value="-">dash (-)</option>
                <option value=" ">space ( )</option>
                <option value="_">underscore (_)</option>
                <option value=".">dot (.)</option>
                <option value="">none</option>
              </select>
            </label>
            <label class="check"><input type="checkbox" id="optCaps" checked /> Capitalize words</label>
            <label class="check"><input type="checkbox" id="optPpNum" checked /> Append random digit</label>
          </div>
          <div id="pinOpts" class="hidden">
            <label class="slider-row">Digits <strong id="pinVal">6</strong>
              <input type="range" id="pinSlider" min="4" max="12" value="6" />
            </label>
          </div>
          <p class="secure-note">🔒 Generated with <code>crypto.getRandomValues</code> — never leaves your browser.</p>
        </section>

        <!-- History -->
        <section class="glass-card hist-card" aria-label="Generation history">
          <div class="hist-head"><h2>🕘 History <span class="sub">stored locally only</span></h2><button class="btn-ghost danger sm" id="btnClearHist">Clear</button></div>
          <ul class="hist-list" id="histList"></ul>
        </section>
      </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>
    <script src="app.js"></script>
  </body>
</html>
