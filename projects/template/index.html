<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Project Template | JavaScript Suite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Top Navigation Dock -->
    <header class="app-header">
      <div class="header-left">
        <a href="../../index.html" class="nav-hub-btn" title="Return to Projects Hub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Hub</span>
        </a>
        <div class="brand">
          <span class="project-num">#XX</span>
          <h1 class="project-title">Project Name</h1>
        </div>
      </div>
    </header>

    <!-- App Stage Container -->
    <main class="app-stage">
      <div class="app-card">
        <h2>Your Project Workspace</h2>
        <p class="app-description">
          This is a starter scaffolding for new JavaScript mini projects. Build your UI components and logic here.
        </p>

        <div class="demo-interactive-area">
          <button class="btn-primary" id="demoBtn">Click Me</button>
          <span class="demo-output" id="demoOutput">Ready...</span>
        </div>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
