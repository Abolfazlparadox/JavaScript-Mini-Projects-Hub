<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CryptoPulse | Real-Time Market Ticker</title>
    <meta
      name="description"
      content="High-frequency crypto market tracker with live WebSocket streaming, canvas sparklines, watchlist, price alerts and offline simulation fallback."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="cp-header">
      <div class="header-left">
        <a href="../../index.html" class="nav-hub-btn" title="Return to Projects Hub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Hub</span>
        </a>
        <div class="brand">
          <span class="brand-badge">#16</span>
          <span class="brand-title">CryptoPulse</span>
        </div>
        <span class="conn-pill connecting" id="connPill"><span class="conn-dot"></span><span id="connText">Connecting…</span></span>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="btnAlerts" title="Price alerts (A)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span class="alert-count hidden" id="alertCount">0</span>
        </button>
        <button class="icon-btn" id="btnRefresh" title="Refresh now (R)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
        <button class="icon-btn" id="btnSound" title="Toggle alert sound">
          <svg id="soundOn" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg id="soundOff" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="1" y1="1" x2="23" y2="23"></line>
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          </svg>
        </button>
      </div>
    </header>

    <main class="cp-stage">
      <div class="cp-shell">
        <!-- Market overview strip -->
        <section class="glass-card overview" id="overviewBar" aria-label="Market overview">
          <div class="ov-item"><span class="ov-label">Assets</span><strong id="ovAssets">8</strong></div>
          <div class="ov-item"><span class="ov-label">Gainers</span><strong class="up" id="ovGainers">0</strong></div>
          <div class="ov-item"><span class="ov-label">Losers</span><strong class="down" id="ovLosers">0</strong></div>
          <div class="ov-item"><span class="ov-label">24h Volume</span><strong id="ovVolume">—</strong></div>
          <div class="ov-item"><span class="ov-label">Last update</span><strong id="ovUpdated" class="mono">—</strong></div>
        </section>

        <!-- Controls -->
        <section class="glass-card controls" aria-label="Search and sort">
          <div class="search-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchInput" placeholder="Search coins... ( / )" autocomplete="off" />
          </div>
          <select id="sortSelect" class="field field-sm" title="Sort order">
            <option value="market">Market order</option>
            <option value="price-desc">Price ↓</option>
            <option value="price-asc">Price ↑</option>
            <option value="change-desc">Top gainers</option>
            <option value="change-asc">Top losers</option>
            <option value="volume">Volume ↓</option>
          </select>
          <button class="pill-toggle" id="watchToggle" title="Show watchlist only">⭐ Watchlist</button>
        </section>

        <!-- Coin grid -->
        <section class="coin-grid" id="coinGrid" aria-label="Cryptocurrency prices"></section>
        <div class="empty-state glass-card hidden" id="emptyState">
          <span class="empty-icon">🔍</span>
          <h3>No coins match your search</h3>
          <p>Try a different keyword or disable the watchlist filter.</p>
        </div>
      </div>
    </main>

    <!-- Detail modal -->
    <div class="modal-overlay hidden" id="detailModal">
      <div class="modal-window glass-card wide" role="dialog" aria-modal="true" aria-label="Coin details">
        <div class="modal-header">
          <h3 id="detailTitle">BTC / USDT</h3>
          <button class="btn-close" id="btnCloseDetail">✕</button>
        </div>
        <div class="detail-price-row">
          <span class="detail-price" id="detailPrice">$0.00</span>
          <span class="chg-badge" id="detailChange">+0.00%</span>
        </div>
        <div class="detail-chart-wrap"><canvas id="detailChart"></canvas></div>
        <div class="detail-stats" id="detailStats"></div>
        <div class="alert-form">
          <h4>🔔 Set price alert</h4>
          <div class="alert-form-row">
            <select id="alertCond" class="field field-sm">
              <option value="above">Price above</option>
              <option value="below">Price below</option>
            </select>
            <input type="number" id="alertPrice" class="field field-sm" placeholder="Target price (USD)" step="any" min="0" />
            <button class="btn-primary" id="btnCreateAlert">Create</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Alerts modal -->
    <div class="modal-overlay hidden" id="alertsModal">
      <div class="modal-window glass-card" role="dialog" aria-modal="true" aria-label="Price alerts">
        <div class="modal-header">
          <h3>🔔 Price Alerts</h3>
          <button class="btn-close" id="btnCloseAlerts">✕</button>
        </div>
        <div class="alerts-list" id="alertsList"></div>
        <div class="modal-footer">
          <button class="btn-ghost danger" id="btnClearAlerts">Clear all</button>
          <button class="btn-primary" id="btnDoneAlerts">Done</button>
        </div>
      </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <script src="app.js"></script>
  </body>
</html>
