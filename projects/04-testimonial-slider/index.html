<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura Testimonials | Interactive Review Carousel</title>
    <meta
      name="description"
      content="A responsive testimonial slider with smooth autoplay, animated timer progress ring, touch swipe support, and customer review submission."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Top Navigation Dock -->
    <header class="slider-header">
      <div class="header-left">
        <a href="../../index.html" class="nav-hub-btn" title="Return to Projects Hub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Hub</span>
        </a>
        <div class="brand">
          <span class="brand-badge">#04</span>
          <span class="brand-title">Aura Testimonials</span>
        </div>
      </div>

      <div class="header-right">
        <button class="btn-new-review" id="btnOpenReviewModal">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Add Review</span>
        </button>

        <button class="autoplay-toggle-btn" id="autoplayBtn" title="Toggle Autoplay">
          <svg class="progress-ring" width="36" height="36" viewBox="0 0 36 36">
            <circle class="ring-bg" cx="18" cy="18" r="15.5"></circle>
            <circle class="ring-bar" id="ringBar" cx="18" cy="18" r="15.5"></circle>
          </svg>
          <span class="play-icon" id="playIcon">⏸</span>
        </button>
      </div>
    </header>

    <!-- Main Workspace Stage -->
    <main class="slider-stage">
      <div class="slider-wrapper">
        <!-- Main Card Deck -->
        <article class="testimonial-card glass-card" id="testimonialCard">
          <div class="quote-mark">“</div>

          <!-- Avatar & Identity -->
          <div class="reviewer-header">
            <div class="avatar-frame">
              <img src="assets/img/Yoo_In-Na-1982-p1.jpg" alt="Reviewer Avatar" class="avatar-img" id="reviewerImg" />
              <div class="verified-badge" title="Verified Customer">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                  <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                </svg>
              </div>
            </div>

            <div class="reviewer-meta">
              <h2 class="reviewer-name" id="reviewerName">Sophia Chen</h2>
              <div class="reviewer-role" id="reviewerRole">Product Designer at Vercel</div>
              <div class="rating-stars" id="ratingStars">★★★★★</div>
            </div>
          </div>

          <!-- Quote Body Text -->
          <blockquote class="review-body" id="reviewBody">
            "The architecture and component system built into this project are simply extraordinary. Clean, accessible, and blindingly fast. A true benchmark for modern frontend standards."
          </blockquote>

          <!-- Controls Section -->
          <div class="slider-controls">
            <!-- Nav Arrows -->
            <div class="arrow-buttons">
              <button class="arrow-btn" id="btnPrev" title="Previous (←)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <line x1="19" y1="12" x2="5" y2="12"></line>
                  <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
              </button>
              <button class="arrow-btn" id="btnNext" title="Next (→)">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </button>
            </div>

            <!-- Dots -->
            <div class="slider-dots" id="sliderDots">
              <!-- Dynamically populated dot pills -->
            </div>

            <!-- Surprise Me Button -->
            <button class="btn-random" id="btnRandom" title="Surprise Me (Random Review)">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="16 3 21 3 21 8"></polyline>
                <line x1="4" y1="20" x2="21" y2="3"></line>
                <polyline points="21 16 21 21 16 21"></polyline>
                <line x1="15" y1="15" x2="21" y2="21"></line>
                <line x1="4" y1="4" x2="9" y2="9"></line>
              </svg>
              <span>Random</span>
            </button>
          </div>
        </article>
      </div>
    </main>

    <!-- Write a Review Modal -->
    <div class="modal-overlay hidden" id="reviewModal">
      <div class="modal-window glass-card">
        <div class="modal-header">
          <h3>Share Your Review</h3>
          <button class="btn-close" id="btnCloseReviewModal">✕</button>
        </div>
        <form class="modal-form" id="newReviewForm">
          <div class="form-group">
            <label for="inputName">Your Full Name:</label>
            <input type="text" id="inputName" placeholder="e.g. Alex Morgan" required />
          </div>
          <div class="form-group">
            <label for="inputRole">Company / Role:</label>
            <input type="text" id="inputRole" placeholder="e.g. Staff Engineer at Stripe" required />
          </div>
          <div class="form-group">
            <label for="inputRating">Rating:</label>
            <select id="inputRating" class="custom-select">
              <option value="5">★★★★★ (5 Stars - Outstanding)</option>
              <option value="4">★★★★☆ (4 Stars - Great)</option>
              <option value="3">★★★☆☆ (3 Stars - Average)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="inputReview">Your Feedback:</label>
            <textarea id="inputReview" rows="4" placeholder="Write your thoughts..." required></textarea>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn-cancel" id="btnCancelModal">Cancel</button>
            <button type="submit" class="btn-submit">Submit Review</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Toast Banner -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="app.js"></script>
  </body>
</html>
