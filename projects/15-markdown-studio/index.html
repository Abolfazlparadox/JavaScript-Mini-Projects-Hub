<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Live Studio | Split-Pane Editor & Preview</title>
    <meta
      name="description"
      content="High-performance split-pane Markdown editor with custom zero-dependency parser, sync scrolling, toolbar, counters and HTML/Markdown export."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="md-header">
      <div class="header-left">
        <a href="../../index.html" class="nav-hub-btn" title="Return to Projects Hub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Hub</span>
        </a>
        <div class="brand">
          <span class="brand-badge">#15</span>
          <span class="brand-title">Markdown Live Studio</span>
        </div>
      </div>
      <div class="header-right">
        <div class="view-switch" id="viewSwitch" role="tablist" aria-label="View mode">
          <button class="view-btn" data-view="editor" title="Editor only">✏️</button>
          <button class="view-btn active" data-view="split" title="Split view">◧</button>
          <button class="view-btn" data-view="preview" title="Preview only">👁</button>
        </div>
        <button class="icon-btn" id="btnCopyHtml" title="Copy rendered HTML">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
        <button class="icon-btn" id="btnExportHtml" title="Download standalone .html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>
        <button class="icon-btn" id="btnDownloadMd" title="Download .md source">
          <span class="md-mini">MD</span>
        </button>
        <button class="icon-btn" id="btnPrint" title="Print / Save as PDF">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 6 2 18 2 18 9"></polyline>
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
            <rect x="6" y="14" width="12" height="8"></rect>
          </svg>
        </button>
      </div>
    </header>

    <div class="toolbar" id="toolbar" aria-label="Markdown formatting toolbar">
      <button data-cmd="h1" title="Heading 1">H1</button>
      <button data-cmd="h2" title="Heading 2">H2</button>
      <button data-cmd="h3" title="Heading 3">H3</button>
      <span class="sep"></span>
      <button data-cmd="bold" title="Bold (Ctrl+B)"><strong>B</strong></button>
      <button data-cmd="italic" title="Italic (Ctrl+I)"><em>I</em></button>
      <button data-cmd="strike" title="Strikethrough"><s>S</s></button>
      <button data-cmd="code" title="Inline code">&lt;&gt;</button>
      <span class="sep"></span>
      <button data-cmd="quote" title="Blockquote">❝</button>
      <button data-cmd="ul" title="Bullet list">• List</button>
      <button data-cmd="ol" title="Numbered list">1. List</button>
      <button data-cmd="task" title="Task list">☑ Task</button>
      <span class="sep"></span>
      <button data-cmd="link" title="Link (Ctrl+K)">🔗</button>
      <button data-cmd="image" title="Image">🖼</button>
      <button data-cmd="table" title="Insert table">▦</button>
      <button data-cmd="hr" title="Horizontal rule">―</button>
      <button data-cmd="fence" title="Code block">```</button>
      <span class="sep"></span>
      <button data-cmd="sample" title="Load sample document">📄 Sample</button>
      <button data-cmd="clear" class="danger" title="Clear editor">🧹</button>
    </div>

    <main class="md-stage view-split" id="mdStage">
      <section class="pane editor-pane" aria-label="Markdown source">
        <div class="pane-head"><span>📝 source.md</span><span class="save-state" id="saveState">● saved</span></div>
        <textarea id="editor" spellcheck="false" placeholder="# Start writing Markdown..."></textarea>
      </section>
      <section class="pane preview-pane" aria-label="Rendered preview">
        <div class="pane-head"><span>👁 preview</span><label class="sync-toggle" title="Synchronized scrolling"><input type="checkbox" id="syncToggle" checked /> sync scroll</label></div>
        <article class="markdown-body" id="preview"></article>
      </section>
    </main>

    <footer class="statusbar" aria-label="Document statistics">
      <span>Words <strong id="statWords">0</strong></span>
      <span>Characters <strong id="statChars">0</strong></span>
      <span>Lines <strong id="statLines">0</strong></span>
      <span>Reading <strong id="statRead">0 min</strong></span>
      <span class="spacer"></span>
      <span class="hint">Ctrl+B bold • Ctrl+I italic • Ctrl+K link • Ctrl+S export</span>
    </footer>

    <div class="toast-container" id="toastContainer"></div>
    <script src="app.js"></script>
  </body>
</html>
